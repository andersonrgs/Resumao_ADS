<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Estudos ADS — Acesso Seguro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --surface-bg: #0f172a;
            --card-bg: #131c31;
            --border: #243049;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --rose-500: #f43f5e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lock-container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
        }
        .lock-card {
            background: var(--surface-bg);
            border: 1px solid var(--border);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(59, 130, 246, 0.12);
            border-radius: 20px;
            padding: 40px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .lock-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #10b981);
        }
        .lock-icon {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }
        .lock-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .lock-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 26px;
        }
        .lock-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }
        .input-wrap {
            position: relative;
        }
        .lock-input {
            width: 100%;
            background: #1e293b;
            border: 1.5px solid #334155;
            border-radius: 12px;
            padding: 14px 44px 14px 16px;
            color: #f8fafc;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }
        .lock-input:focus {
            border-color: var(--blue-500);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .btn-toggle-eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }
        .btn-toggle-eye:hover { color: #f8fafc; }
        .lock-btn {
            background: linear-gradient(135deg, var(--blue-600), var(--blue-500));
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
        }
        .lock-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, var(--blue-600));
            transform: translateY(-1px);
        }
        .lock-error {
            display: none;
            color: var(--rose-500);
            font-size: 13px;
            font-weight: 500;
            margin-top: -6px;
            text-align: center;
        }
        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        #decryption-indicator {
            display: none;
            color: var(--blue-500);
            font-size: 13px;
            text-align: center;
            margin-top: 4px;
        }
    </style>
</head>
<body id="portal-body">

    <div class="lock-container" id="lock-screen">
        <div class="lock-card" id="lockCard">
            <div class="lock-icon">🛡️</div>
            <h2 class="lock-title">Portal ADS 2026.2</h2>
            <p class="lock-desc">Digite a chave de segurança para descriptografar os simulados e manuais de estudo em memória.</p>
            
            <form class="lock-form" id="lockForm" onsubmit="event.preventDefault(); attemptUnlock();">
                <div class="input-wrap">
                    <input type="password" id="pwdInput" class="lock-input" placeholder="Chave de segurança..." autofocus autocomplete="current-password" required>
                    <button type="button" class="btn-toggle-eye" id="toggleEye" onclick="toggleEyeAction()" title="Mostrar senha">👁️</button>
                </div>
                <div id="lockError" class="lock-error">Chave incorreta ou acesso não autorizado!</div>
                <div id="decryption-indicator">Descriptografando dados em memória...</div>
                <button type="submit" class="lock-btn" id="btnUnlock">
                    <span>Desbloquear Portal</span>
                    <span>🔓</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        
(function() {
    'use strict';
    // Bloqueia clique com botão direito
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });

    // Bloqueia atalhos de inspeção e desenvolvedor
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
            (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    });

    // Anti-debugger loop em thread secundária
    setInterval(function() {
        try {
            (function() {
                return false;
            }['constructor']('debugger')());
        } catch(e) {}
    }, 700);

    // Limpeza de console para evitar inspeção de variáveis em memória
    setInterval(function() {
        try { console.clear(); } catch(e) {}
    }, 1800);
})();

        const _SESSION_KEY = '__ads_auth_vault_token';

        
async function _decryptVault(pwd, payload) {
    const salt = Uint8Array.from(atob(payload.s), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(payload.v), c => c.charCodeAt(0));
    const ct = Uint8Array.from(atob(payload.d), c => c.charCodeAt(0));
    
    const enc = new TextEncoder();
    const passKey = await window.crypto.subtle.importKey(
        'raw',
        enc.encode(pwd),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
    );
    
    const key = await window.crypto.subtle.deriveKey(
        {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
        },
        passKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
    );
    
    const decrypted = await window.crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        ct
    );
    
    return new TextDecoder().decode(decrypted);
}


        function toggleEyeAction() {
            const input = document.getElementById('pwdInput');
            const eye = document.getElementById('toggleEye');
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                eye.textContent = '🙈';
            } else {
                input.type = 'password';
                eye.textContent = '👁️';
            }
        }

        async function attemptUnlock(savedPassword) {
            const input = document.getElementById('pwdInput');
            const errorEl = document.getElementById('lockError');
            const cardEl = document.getElementById('lockCard');
            const indicatorEl = document.getElementById('decryption-indicator');
            const btnEl = document.getElementById('btnUnlock');

            const pwd = savedPassword || (input ? input.value.trim() : '');
            if (!pwd) return;

            if (indicatorEl) indicatorEl.style.display = 'block';
            if (btnEl) btnEl.disabled = true;

            try {
                const decryptedHtml = await _decryptVault(pwd, _PORTAL_PAYLOAD);
                
                // Salva a chave temporária estritamente na sessão da memória desta aba
                sessionStorage.setItem(_SESSION_KEY, pwd);

                // Monta o DOM descriptografado
                document.body.innerHTML = decryptedHtml;
                document.body.style.display = 'block';

                // Injeta botão de bloqueio na navbar
                const headerTags = document.querySelector('.header-tags');
                if (headerTags) {
                    const lockBtn = document.createElement('button');
                    lockBtn.className = 'tag';
                    lockBtn.style.background = 'rgba(244, 63, 94, 0.15)';
                    lockBtn.style.border = '1px solid rgba(244, 63, 94, 0.4)';
                    lockBtn.style.color = '#fda4af';
                    lockBtn.style.cursor = 'pointer';
                    lockBtn.style.fontWeight = '700';
                    lockBtn.innerHTML = '🔒 Bloquear';
                    lockBtn.onclick = function() {
                        sessionStorage.removeItem(_SESSION_KEY);
                        window.location.reload();
                    };
                    headerTags.prepend(lockBtn);
                }

                // Executa os scripts internos do portal descriptografado
                const scripts = document.body.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });

            } catch (err) {
                if (indicatorEl) indicatorEl.style.display = 'none';
                if (btnEl) btnEl.disabled = false;
                if (errorEl) errorEl.style.display = 'block';
                if (cardEl) {
                    cardEl.classList.remove('shake');
                    void cardEl.offsetWidth;
                    cardEl.classList.add('shake');
                }
                if (input) {
                    input.value = '';
                    input.focus();
                }
            }
        }

        // Se já estiver autenticado na sessão atual, abre instantaneamente
        document.addEventListener('DOMContentLoaded', () => {
            const cachedToken = sessionStorage.getItem(_SESSION_KEY);
            if (cachedToken) {
                attemptUnlock(cachedToken);
            }
        });
    </script>
