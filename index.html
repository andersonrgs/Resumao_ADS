    <style>
        :root {
            --bg: #090d16;
            --surface-bg: #0f172a;
            --card-bg: #131c31;
            --border: #243049;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --rose-500: #f43f5e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lock-container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
        }
        .lock-card {
            background: var(--surface-bg);
            border: 1px solid var(--border);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(59, 130, 246, 0.12);
            border-radius: 20px;
            padding: 40px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .lock-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #10b981);
        }
        .lock-icon {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }
        .lock-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .lock-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 26px;
        }
        .lock-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }
        .input-wrap {
            position: relative;
        }
        .lock-input {
            width: 100%;
            background: #1e293b;
            border: 1.5px solid #334155;
            border-radius: 12px;
            padding: 14px 44px 14px 16px;
            color: #f8fafc;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }
        .lock-input:focus {
            border-color: var(--blue-500);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .btn-toggle-eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }
        .btn-toggle-eye:hover { color: #f8fafc; }
        .lock-btn {
            background: linear-gradient(135deg, var(--blue-600), var(--blue-500));
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
        }
        .lock-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, var(--blue-600));
            transform: translateY(-1px);
        }
        .lock-error {
            display: none;
            color: var(--rose-500);
            font-size: 13px;
            font-weight: 500;
            margin-top: -6px;
            text-align: center;
        }
        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        #decryption-indicator {
            display: none;
            color: var(--blue-500);
            font-size: 13px;
            text-align: center;
            margin-top: 4px;
        }
    </style>

        const _SESSION_KEY = '__ads_auth_vault_token';

        
async function _decryptVault(pwd, payload) {
    const salt = Uint8Array.from(atob(payload.s), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(payload.v), c => c.charCodeAt(0));
    const ct = Uint8Array.from(atob(payload.d), c => c.charCodeAt(0));
    
    const enc = new TextEncoder();
    const passKey = await window.crypto.subtle.importKey(
        'raw',
        enc.encode(pwd),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
    );
    
    const key = await window.crypto.subtle.deriveKey(
        {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
        },
        passKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
    );
    
    const decrypted = await window.crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        ct
    );
    
    return new TextDecoder().decode(decrypted);
}


        function toggleEyeAction() {
            const input = document.getElementById('pwdInput');
            const eye = document.getElementById('toggleEye');
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                eye.textContent = '🙈';
            } else {
                input.type = 'password';
                eye.textContent = '👁️';
            }
        }

        async function attemptUnlock(savedPassword) {
            const input = document.getElementById('pwdInput');
            const errorEl = document.getElementById('lockError');
            const cardEl = document.getElementById('lockCard');
            const indicatorEl = document.getElementById('decryption-indicator');
            const btnEl = document.getElementById('btnUnlock');

            const pwd = savedPassword || (input ? input.value.trim() : '');
            if (!pwd) return;

            if (indicatorEl) indicatorEl.style.display = 'block';
            if (btnEl) btnEl.disabled = true;

            try {
                const decryptedHtml = await _decryptVault(pwd, _PORTAL_PAYLOAD);
                
                // Salva a chave temporária estritamente na sessão da memória desta aba
                sessionStorage.setItem(_SESSION_KEY, pwd);

                // Monta o DOM completo descriptografado com todos os estilos CSS originais
                document.open();
                document.write(decryptedHtml);
                document.close();

            } catch (err) {
                if (indicatorEl) indicatorEl.style.display = 'none';
                if (btnEl) btnEl.disabled = false;
                if (errorEl) errorEl.style.display = 'block';
                if (cardEl) {
                    cardEl.classList.remove('shake');
                    void cardEl.offsetWidth;
                    cardEl.classList.add('shake');
                }
                if (input) {
                    input.value = '';
                    input.focus();
                }
            }
        }

        // Se já estiver autenticado na sessão atual, abre instantaneamente
        document.addEventListener('DOMContentLoaded', () => {
            const cachedToken = sessionStorage.getItem(_SESSION_KEY);
            if (cachedToken) {
                attemptUnlock(cachedToken);
            }
        });

        // PWA Service Worker & Install Handler
        let deferredPrompt = null;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA ServiceWorker ativo:', reg.scope))
                    .catch(err => console.log('PWA ServiceWorker erro:', err));
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const pwaBtns = document.querySelectorAll('.btn-pwa-install');
            pwaBtns.forEach(b => { b.style.display = 'inline-flex'; });
        });

        function triggerPwaInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('PWA instalado!');
                    }
                    deferredPrompt = null;
                    const pwaBtns = document.querySelectorAll('.btn-pwa-install');
                    pwaBtns.forEach(b => { b.style.display = 'none'; });
                });
            } else {
                alert('📱 Para instalar no celular Android:
1. Toque nos 3 pontos (⋮) no canto superior direito do Chrome.
2. Toque em "Instalar aplicativo" ou "Adicionar à tela inicial".');
            }
        }

        window.addEventListener('appinstalled', () => {
            const pwaBtns = document.querySelectorAll('.btn-pwa-install');
            pwaBtns.forEach(b => { b.style.display = 'none'; });
        });
    </script>
