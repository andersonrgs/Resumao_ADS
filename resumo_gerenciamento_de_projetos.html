    <style>
        :root {
            --bg: #0b0f19;
            --surface: #111827;
            --surface-elevated: #1f2937;
            --border: #374151;
            --border-subtle: #1f2937;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: rgba(59, 130, 246, 0.15);
            --accent: #8b5cf6;
            --accent-light: rgba(139, 92, 246, 0.15);
            --success: #10b981;
            --success-light: rgba(16, 185, 129, 0.15);
            --warning: #f59e0b;
            --warning-light: rgba(245, 158, 11, 0.15);
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
            padding-bottom: 5rem;
            -webkit-font-smoothing: antialiased;
        }

        .top-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
            background-color: rgba(11, 15, 25, 0.85);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            font-size: 1rem;
        }

        .nav-brand .badge {
            background: var(--primary-light);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface-elevated);
            color: var(--text);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background: #374151;
            color: #fff;
        }

        .container {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .page-header {
            background: linear-gradient(180deg, rgba(31, 41, 55, 0.6) 0%, rgba(17, 24, 39, 0.8) 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.25rem 2rem;
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #10b981);
        }

        .meta-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .meta-pill {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .meta-pill.highlight {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.35);
            color: #fbbf24;
        }

        .page-header h1 {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: #f9fafb;
            margin-bottom: 0.75rem;
            line-height: 1.25;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 750px;
        }

        .content {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: var(--shadow);

        .content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #60a5fa;
            margin-top: 2.5rem;

            padding-bottom: 0.5rem;

            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .content h2:first-child {
            margin-top: 0;
        }

        .content h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e5e7eb;
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
        }

        .content p {
            margin-bottom: 1.15rem;
            color: #d1d5db;
        }

        .content ul, .content ol {
            margin-bottom: 1.25rem;
            padding-left: 1.5rem;
            color: #d1d5db;
        }

        .content li {
            margin-bottom: 0.4rem;
        }

        .content strong {
            color: #f3f4f6;
            font-weight: 600;
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0 2rem;
            font-size: 0.925rem;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .content th {
            background: #1e293b;
            color: #93c5fd;
            font-weight: 700;
            text-align: left;
            padding: 0.85rem 1rem;
            border-bottom: 2px solid var(--border);
        }

        .content td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #1e293b;
            color: #cbd5e1;
            vertical-align: top;
        }

        .content tr:nth-child(even) {
            background: rgba(30, 41, 59, 0.4);
        }

        .content tr:hover {
            background: rgba(59, 130, 246, 0.08);
        }

        .content blockquote {
            background: rgba(31, 41, 55, 0.5);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.25rem;
            border-radius: 0 8px 8px 0;
            margin: 1.5rem 0;
            color: #e5e7eb;
        }

        .alert-box {
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .alert-important {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .alert-tip {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
        }

        .alert-note {
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.35);
            color: #93c5fd;
        }

        .mermaid {
            background: #0f172a;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin: 1.75rem 0;
            text-align: center;
            overflow-x: auto;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.1);
            color: #f472b6;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85em;
        }

        pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
        }

        @media (max-width: 768px) {
            .content {
                padding: 1.5rem;
            }
            .page-header {
                padding: 1.5rem 1.25rem;
            }
            .page-header h1 {
                font-size: 1.6rem;
            }
        }

        const _SESSION_KEY = '__ads_auth_vault_token';

        
async function _decryptVault(pwd, payload) {
    const salt = Uint8Array.from(atob(payload.s), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(payload.v), c => c.charCodeAt(0));
    const ct = Uint8Array.from(atob(payload.d), c => c.charCodeAt(0));
    
    const enc = new TextEncoder();
    const passKey = await window.crypto.subtle.importKey(
        'raw',
        enc.encode(pwd),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
    );
    
    const key = await window.crypto.subtle.deriveKey(
        {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
        },
        passKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
    );
    
    const decrypted = await window.crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        ct
    );
    
    return new TextDecoder().decode(decrypted);
}


        async function unlockResumo(savedPassword) {
            const input = document.getElementById('resumoPwd');
            const errorEl = document.getElementById('resumoError');
            const lockBox = document.getElementById('resumo-lock');
            const mount = document.getElementById('decrypted-resumo-mount');
            const btn = document.getElementById('btnResUnlock');

            const pwd = savedPassword || (input ? input.value.trim() : '');
            if (!pwd) return;

            if (btn) btn.disabled = true;

            try {
                const decryptedHtml = await _decryptVault(pwd, _RESUMO_PAYLOAD);
                sessionStorage.setItem(_SESSION_KEY, pwd);

                if (lockBox) lockBox.style.display = 'none';
                if (mount) {
                    mount.innerHTML = decryptedHtml;
                    mount.style.display = 'block';

                    // Inicializa os diagramas Mermaid
                    if (window.mermaid) {
                        mermaid.run();
                    }

                    const scripts = mount.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                }
            } catch(err) {
                if (btn) btn.disabled = false;
                if (errorEl) errorEl.style.display = 'block';
                if (input) {
                    input.value = '';
                    input.focus();
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const cachedToken = sessionStorage.getItem(_SESSION_KEY);
            if (cachedToken) {
                unlockResumo(cachedToken);
            }
        });
    </script>
